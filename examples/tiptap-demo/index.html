<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@boceto/tiptap demo</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #6b7280;
        --rule: #e5e7eb;
        --paper: #f9fafb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: white;
      }
      header.demo {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 24px 12px;
      }
      header.demo h1 { margin: 0 0 6px; font-size: 26px; }
      header.demo p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; }
      main.demo { max-width: 980px; margin: 0 auto; padding: 0 24px 64px; }

      .toolbar {
        display: flex;
        gap: 8px;
        padding: 6px;
        margin-bottom: 12px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 8px;
      }
      .toolbar button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13.5px;
        color: var(--ink);
        background: white;
        border: 1px solid var(--rule);
        border-radius: 6px;
        cursor: pointer;
      }
      .toolbar button:hover { background: var(--paper); }
      .toolbar button .icon { display: inline-flex; width: 18px; height: 18px; color: var(--ink); }

      .ProseMirror {
        min-height: 320px;
        padding: 18px 22px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.55;
        outline: none;
      }
      .ProseMirror p { margin: 0 0 10px; }
      .ProseMirror h2 { font-size: 18px; margin: 18px 0 8px; }

      .boceto-block { margin: 16px 0; }
      .boceto-block__shell {
        position: relative;
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        background: white;
      }
      .boceto-block__shell--selected { border-color: #6e9bd8; }
      .boceto-block__shell--editing {
        border-color: #6e9bd8;
        cursor: default;
        padding: 0;
        overflow: hidden;
      }
      .boceto-block__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px;
        background: #eff4fb;
        border-bottom: 1px solid #cfdcef;
        color: #2c5494;
        font-size: 12px;
      }
      .boceto-block__done {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        font-size: 12px;
        color: white;
        background: #2c5494;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .boceto-block__canvas { position: relative; }
      .boceto-block__edit-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        font-size: 12px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .boceto-block__shell:hover .boceto-block__edit-btn { opacity: 1; }
    </style>
  </head>
  <body>
    <header class="demo">
      <h1>@boceto/tiptap — cross-block component context</h1>
      <p>
        A Boceto block can <em>define</em> a component, and another block in the same TipTap
        document can <em>use</em> it. The <code>BocetoContext</code> extension broadcasts the
        doc-level source so every block resolves references through the same registry.
      </p>
    </header>
    <main class="demo">
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
